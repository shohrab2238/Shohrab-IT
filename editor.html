<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Website</title><style>body{font-family:Arial;background:#f4f6f8;color:#142238;margin:0}.box{max-width:900px;margin:30px auto;background:#fff;padding:25px;border-radius:16px}label{display:block;font-weight:bold;margin:12px 0}input,textarea{width:100%;padding:10px;box-sizing:border-box;border:1px solid #ccd3dc;border-radius:8px;font:inherit}textarea{min-height:90px}.btn{padding:11px 16px;border:1px solid #ff7045;border-radius:8px;background:#fff;font-weight:bold;cursor:pointer}.primary{background:#ff7045;color:#fff}.item{border:1px solid #e4e7ec;padding:15px;border-radius:12px;margin:12px 0}.note{background:#fff7e8;padding:12px;border-radius:8px}.actions{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><div class="box"><h1>⚙ Edit Shohrab Hossen Website</h1><div class="note">Edit your information, then click <b>Download data.json</b>. Upload that file to GitHub and replace the old data.json to update the live website.</div><div id="fields"></div><h2>Services</h2><div id="services"></div><h2>Projects</h2><div id="projects"></div><div class="actions"><button class="btn primary" onclick="download()">⬇ Download data.json</button><button class="btn" onclick="save()">💾 Save Locally</button><a class="btn" href="./">Back to Website</a></div><p id="msg"></p></div><script>let d;const keys=['first','last','role','bio','about','email','phone','location','availability','years','clients','fb','li','gh','cv'];const F=document.getElementById('fields');async function init(){d=JSON.parse(localStorage.getItem('shohrabData')||'null')||await(await fetch('data.json?x='+Date.now())).json();F.innerHTML=keys.map(k=>`<label>${k}<input id="e_${k}" value="${esc(d[k]||'')}"></label>`).join('');document.getElementById('services').innerHTML=d.services.map((s,i)=>`<div class="item"><label>Icon<input id="s${i}0" value="${esc(s[0])}"></label><label>Name<input id="s${i}1" value="${esc(s[1])}"></label><label>Description<textarea id="s${i}2">${esc(s[2])}</textarea></label></div>`).join('');document.getElementById('projects').innerHTML=d.projects.map((p,i)=>`<div class="item"><label>Name<input id="p${i}0" value="${esc(p[0])}"></label><label>Category<input id="p${i}1" value="${esc(p[1])}"></label><label>Description<textarea id="p${i}2">${esc(p[2])}</textarea></label></div>`).join('')}function esc(x){return String(x??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function read(){keys.forEach(k=>d[k]=document.getElementById('e_'+k).value);d.services=d.services.map((_,i)=>[document.getElementById('s'+i+'0').value,document.getElementById('s'+i+'1').value,document.getElementById('s'+i+'2').value]);d.projects=d.projects.map((_,i)=>[document.getElementById('p'+i+'0').value,document.getElementById('p'+i+'1').value,document.getElementById('p'+i+'2').value])}function save(){read();localStorage.setItem('shohrabData',JSON.stringify(d));document.getElementById('msg').textContent='✓ Saved on this browser.'}function download(){read();let b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='data.json';a.click();document.getElementById('msg').textContent='✓ data.json downloaded. Upload it to GitHub.'}init();</script></body></html>
